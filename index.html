// StorageManager: 统一存储抽象层，支持文件系统/IndexedDB/localStorage
const StorageManager={
  type:null,
  fileHandle:null,

  async init(){
    if('showSaveFilePicker' in window){
      const handle=await this.getStoredFileHandle();
      if(handle){
        this.fileHandle=handle;
        this.type='filesystem';
        return{success:true,type:'filesystem'};
      }
      return await this.setupFileSystem();
    }else{
      this.type='indexeddb';
      await this.setupIndexedDB();
      return{success:true,type:'indexeddb'};
    }
  },

  async setupFileSystem(){
    try{
      const handle=await window.showSaveFilePicker({
        suggestedName:'decision-tracker-data.json',
        types:[{description:'Decision Tracker Data',accept:{'application/json':['.json']}}]
      });
      this.fileHandle=handle;
      await this.storeFileHandle(handle);
      this.type='filesystem';
      return{success:true,type:'filesystem'};
    }catch(e){
      return{success:false,error:'user_cancelled'};
    }
  },

  async save(data){
    if(this.type==='filesystem'&&this.fileHandle){
      const writable=await this.fileHandle.createWritable();
      await writable.write(JSON.stringify(data,null,2));
      await writable.close();
    }else if(this.type==='indexeddb'){
      const db=await this.openDB();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction('data','readwrite');
        const store=tx.objectStore('data');
        store.put(data,'memos');
        tx.oncomplete=()=>resolve();
        tx.onerror=()=>reject(tx.error);
      });
    }else{
      localStorage.setItem('decision-discussions',JSON.stringify(data));
    }
  },

  async load(){
    if(this.type==='filesystem'&&this.fileHandle){
      const file=await this.fileHandle.getFile();
      const text=await file.text();
      return JSON.parse(text);
    }else if(this.type==='indexeddb'){
      const db=await this.openDB();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction('data','readonly');
        const store=tx.objectStore('data');
        const req=store.get('memos');
        req.onsuccess=()=>resolve(req.result||null);
        req.onerror=()=>reject(req.error);
      });
    }else{
      const saved=localStorage.getItem('decision-discussions');
      return saved?JSON.parse(saved):null;
    }
  },

  async storeFileHandle(handle){
    const db=await this.openDB();
    const tx=db.transaction('settings','readwrite');
    await tx.objectStore('settings').put(handle,'fileHandle');
  },

  async getStoredFileHandle(){
    try{
      const db=await this.openDB();
      const tx=db.transaction('settings','readonly');
      const handle=await tx.objectStore('settings').get('fileHandle');
      if(handle){
        const permission=await handle.queryPermission({mode:'readwrite'});
        if(permission==='granted')return handle;
        if(permission==='prompt'){
          const requested=await handle.requestPermission({mode:'readwrite'});
          if(requested==='granted')return handle;
        }
      }
    }catch(e){
      console.error('Failed to restore file handle:',e);
    }
    return null;
  },

  async openDB(){
    return new Promise((resolve,reject)=>{
      const request=indexedDB.open('DecisionTrackerDB',1);
      request.onerror=()=>reject(request.error);
      request.onsuccess=()=>resolve(request.result);
      request.onupgradeneeded=(event)=>{
        const db=event.target.result;
        if(!db.objectStoreNames.contains('settings')){
          db.createObjectStore('settings');
        }
        if(!db.objectStoreNames.contains('data')){
          db.createObjectStore('data');
        }
      };
    });
  },

  async setupIndexedDB(){
    await this.openDB();
  }
};

const checkStorageAvailable=()=>{
  try{
    const test='__storage_test__';
    localStorage.setItem(test,test);
    localStorage.removeItem(test);
    return true;
  }catch(e){
    return false;
  }
};

        }else{

            setMemos(parsed);
            await StorageManager.save(parsed);

          }else{
            setMemos(INIT);
          }
        }
        setStorageType(result.type);
        setStorageReady(true);
      }else{
        setShowStorageSetup(true);
        setMemos(INIT);
        setStorageReady(true);
      }
    }
    initStorage();
  },[]);

  React.useEffect(()=>{
    if(!storageReady)return;
    setSaveStatus("saving");
    async function save(){
      try{
        await StorageManager.save(memos);
        setSaveStatus("saved");
        setTimeout(()=>setSaveStatus("idle"),2000);
      }catch(e){
        console.error("Save failed:",e);
        setSaveStatus("error");
        alert('保存失败：'+e.message+'\n请尝试导出备份');
      }
    }
    save();
  },[memos,storageReady]);
  const sel=memos.find(m=>m.id===selId);
  const alerts=useMemo(()=>memos.filter(m=>m.status!=="已完成"&&m.status!=="已归档"&&(overdue(m.nextReview)||soon(m.nextReview))).sort((a,b)=>(a.nextReview||"9")>(b.nextReview||"9")?1:-1),[memos]);

    if(a.pinned&&!b.pinned)return -1;
    if(!a.pinned&&b.pinned)return 1;

  }),[memos,fS,fP]);
  const upd=(id,u)=>setMemos(ms=>ms.map(m=>m.id===id?{...m,...u}:m));
  const togglePin=id=>upd(id,{pinned:!memos.find(m=>m.id===id)?.pinned});
  const archive=(id)=>{if(!confirm("确定要归档这条 Discussion 吗？"))return;upd(id,{status:"已归档"});setSelId(null)};
  const unarchive=id=>upd(id,{status:"讨论中"});
  const del=(id)=>{if(!confirm("确定要永久删除这条 Discussion 吗？删除后无法恢复！"))return;setMemos(ms=>ms.filter(m=>m.id!==id));setSelId(null)};
  const addNote=()=>{if(!note.trim()||!sel)return;upd(sel.id,{notes:[...sel.notes,{id:++nid,date:TODAY,author:sel.owner,content:note.trim(),type:nType}]});setNote("");setNType("normal")};
  const addTodo=()=>{if(!todoT.trim()||!sel)return;upd(sel.id,{todos:[...sel.todos,{id:++tid,text:todoT.trim(),done:false}]});setTodoT("")};
  const togTodo=id=>sel&&upd(sel.id,{todos:sel.todos.map(t=>t.id===id?{...t,done:!t.done}:t)});
  const delTodo=id=>sel&&upd(sel.id,{todos:sel.todos.filter(t=>t.id!==id)});
  const delNote=id=>sel&&upd(sel.id,{notes:sel.notes.filter(n=>n.id!==id)});
  const create=()=>{if(!nm.topic.trim()||!nm.owner.trim())return;const m={id:++mid,...nm,status:"讨论中",createdAt:TODAY,todos:[],notes:[]};setMemos([m,...memos]);setSelId(m.id);setShowNew(false);setNm({topic:"",conclusion:"",limitingFactor:"",priority:PRIORITIES[0],owner:"",nextReview:"",deadline:"",progress:0});setCustomOwner("")};
  const exportBackup=()=>{const data=JSON.stringify(memos,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`discussions-backup-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.json`;a.click();URL.revokeObjectURL(url)};

  const importBackup=()=>{

        <div style={{flex:1,overflow:"auto",background:"#fafaf9"}}>

            </div>

                <div><div style={{fontSize:11,color:"#888",marginBottom:3}}>下次 Review</div><input type="date" value={sel.nextReview||""} onChange={e=>upd(sel.id,{nextReview:e.target.value})} style={{border:"1px solid "+(overdue(sel.nextReview)?"#ff7875":"#b7eb8f"),borderRadius:4,padding:"3px 6px",fontSize:13,fontWeight:600,color:overdue(sel.nextReview)?"#cf1322":"#333",background:overdue(sel.nextReview)?"#fff1f0":"#fff",outline:"none",fontFamily:"inherit"}}/>{overdue(sel.nextReview)&&<div style={{fontSize:10,color:"#cf1322",fontWeight:600,marginTop:2}}>已过期!</div>}</div>

                {sel.notes.map(n=>{const nc=NC[n.type]||NC.normal;const dot=n.type==="decision"?"#597ef7":n.type==="overturn"?"#cf1322":n.type==="update"?"#d46b08":"#d0cdc7";return(
                  <div key={n.id} style={{position:"relative",marginBottom:16}}>
                    <div style={{position:"absolute",left:-19,top:8,width:9,height:9,borderRadius:"50%",background:dot,border:"2px solid #fafaf9"}}/>

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8}}>
                  <span style={{fontSize:11,color:"#ccc"}}>⌘+Enter 发送</span>
                  <button onClick={addNote} style={BP}>添加笔记</button>
                </div>
              </div>
            </div>
          </div>}
        </div>
      </div>

      {/* Storage Setup Modal */}
      {showStorageSetup&&<div onClick={()=>setShowStorageSetup(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000}}>

          <h2 style={{fontSize:20,fontWeight:700,marginBottom:16}}>💾 选择数据保存位置</h2>

            <div style={{fontSize:12,color:"#096dd9"}}>💡 <strong>提示：</strong>选择云盘文件夹可以自动在多台电脑间同步数据</div>
          </div>
          <div style={{display:"flex",gap:12,justifyContent:"flex-end"}}>
            <button onClick={()=>{StorageManager.type='indexeddb';setStorageType('indexeddb');setShowStorageSetup(false)}} style={BG}>暂时跳过（使用浏览器存储）</button>
            <button onClick={async()=>{const result=await StorageManager.setupFileSystem();if(result.success){setStorageType('filesystem');setShowStorageSetup(false);if(memos.length>0){await StorageManager.save(memos)}}}} style={BP}>选择保存位置</button>
          </div>
        </div>
      </div>}
    </div>
  );
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
